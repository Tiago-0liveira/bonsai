# ─────────────────────────────────────────────────────────────────────────────
#  .bonsai.yaml — project configuration for bonsai (https://github.com/Tiago-0liveira/bonsai)
#  Lives in your repo root. All fields are optional; sensible defaults apply.
# ─────────────────────────────────────────────────────────────────────────────

# Base ref used for two things:
#   1. the ↑ahead / ↓behind counts next to each worktree
#   2. the branch shown as the merge target when pruning a PR worktree
# Format: <remote>/<branch>. Default: origin/main
# Note: for a worktree connected to a GitHub PR, ahead/behind counts and the
# prune "merge to <base>" label use the PR's real base branch (from gh), not this.
upstream: origin/main

# ── Worktree location ────────────────────────────────────────────────────────
# Where new worktrees are created. Both fields optional.
#   root          base directory (default: the repo's parent dir).
#                 relative paths resolve against the repo root.
#   path_template directory name; supports {repo} and {branch}
#                 (branch slashes flattened to '-'). Default: "{repo}-{branch}"
# Default layout is a sibling of the repo, e.g. ../myrepo-feature-login
worktree:
  root: ""
  path_template: "{repo}-{branch}"

# ── Confirmations ────────────────────────────────────────────────────────────
# When true (default), destructive actions (PR merge/close, update-from-base,
# bulk prune) show a yes/no prompt first. Set false to run them immediately.
confirm_destructive: true

# ── Editor ────────────────────────────────────────────────────────────────────
# Command for the "open editor" action (e). Arguments are honored, e.g.
# "code -w". Empty (default) falls back to $VISUAL, then $EDITOR, then vi.
# A personal override set in preferences (state.json) wins over this.
editor: ""

# ── Color theme ──────────────────────────────────────────────────────────────
# preset: one of bonsai (default) / sakura / dracula / nord / mono.
# overrides: per-role color (256-index like "212" or hex like "#ff5555").
#   roles: accent, border, border_focus, dim, text, success, danger, warning, pr_badge
theme:
  preset: "bonsai"
  #overrides: 
    # accent: "212"
    # danger: "#ff5555"

# ── Desktop notifications ────────────────────────────────────────────────────
# process → fire when a background process finishes/fails (default on).
# ci      → fire when a connected PR's CI rollup changes (default off).
notifications:
  process: true
  ci: false

# ── Keybindings ──────────────────────────────────────────────────────────────
# Override any action's key. Action names (defaults in parens):
#   focus_next(tab) focus_prev(shift+tab) shell(enter) editor(e) new_worktree(n)
#   create_pr(ctrl+n) processes(v) log_tab(l) pr_tab(P) diff_tab(d)
#   inspect_tab(i) checks_tab(b) filter(/) sort(o) palette(ctrl+k)
#   copy_file(c) yank(y) scripts(s) aliases(p) pull(ctrl+p) push(ctrl+u)
#   fetch(f) commit(C) rebase(r) update_base(u) prune(x) bulk_prune(X)
#   refresh(R) kill_proc(k) restart_proc(r) prefs(,) help(?) quit(q)
# Keys overridden in-app (preferences modal) take precedence over these.
# A key that collides with another action is ignored with a status-bar warning.
keys: {}
  # new_worktree: "N"
  # prune: "D"

# ── Lifecycle hooks ──────────────────────────────────────────────────────────
# Shell commands run with `sh -c`, in the worktree's directory.
#   on_worktree_create → after a worktree is created (new branch / existing / PR)
#   on_worktree_delete → before a worktree is pruned
# Commands run top-to-bottom and STOP at the first failure. Empty strings are skipped.
#
# Variables — usable as {name} in any command, and also exported as $BONSAI_<NAME>:
#   {new_worktree} / {worktree}     absolute path of the worktree
#   {worktree_name}                 worktree directory name (e.g. repo-feat-login)
#   {main} / {main_branch_path}     absolute path of the main worktree
#   {branch}                        branch name
#   {base_branch}                   base branch from `upstream` (origin/main → main)
#   {repo}                          repository directory name
#   {pr_number}                     connected PR number, or empty
#
# Examples (uncomment and adapt):
hooks:
  on_worktree_create: []
    # - "cp {main}/.env {new_worktree}/.env"     # carry over untracked secrets
    # - "npm install"                            # install deps in the new tree
    # - "echo 'created {branch} at {new_worktree}'"
  on_worktree_delete:
    - "echo 'removing worktree {worktree_name} ({branch})'"

# ── Aliases ──────────────────────────────────────────────────────────────────
# Named commands runnable against the selected worktree:
#   • in the TUI: press `p`, pick one (or `＋ new alias`)
#   • from the CLI: `bonsai x <name> [worktree]`
# Alias commands support the same {variables} as hooks.
# NOTE: aliases here are read-only project defaults. Aliases you add in-app or via
# `bonsai alias add` are saved per-user to ~/.config/bonsai/state.json.
aliases:
  - name: build
    command: "go build ."
  - name: open
    command: "zed {worktree}"                 # open this worktree in Zed
  # - name: dev
  #   command: "npm run dev"
