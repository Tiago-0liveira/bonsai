version: 2
project_name: bonsai
before:
  hooks:
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build
    - pnpm --dir web bundle:check
    - go test -tags embedui ./web/
builds:
  - id: bonsai
    main: .
    binary: bonsai
    tags: [embedui]
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/Tiago-0liveira/bonsai/internal/version.Version={{.Version}} -X github.com/Tiago-0liveira/bonsai/internal/version.Commit={{.Commit}} -X github.com/Tiago-0liveira/bonsai/internal/version.Date={{.Date}}
archives:
  - formats: [tar.gz]
    name_template: 'bonsai_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: install/bcd.bat
        strip_parent: true
checksum:
  name_template: checksums.txt
  algorithm: sha256
release:
  github:
    owner: Tiago-0liveira
    name: bonsai
  draft: true
changelog:
  sort: asc
