name: frontend

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - "feat/web-frontend-prototype"
    paths:
      - "web/**"
      - ".github/workflows/frontend.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/package.json
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e


  package-changed-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test backend state sync and watcher integration
        run: go test ./internal/server/localapi ./internal/daemon/watcher
      - name: Format changed Go files for packaging
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only 5bd81497a901ccfb00613c1c3d23d76669c9440f...HEAD -- '*.go')
          if ((${#files[@]})); then
            gofmt -w "${files[@]}"
          fi
      - name: Package requested change set
        shell: bash
        run: |
          mkdir -p bundle
          while IFS= read -r file; do
            [[ "$file" == ".github/workflows/frontend.yml" ]] && continue
            mkdir -p "bundle/$(dirname "$file")"
            cp "$file" "bundle/$file"
          done < <(git diff --name-only 5bd81497a901ccfb00613c1c3d23d76669c9440f...HEAD)
          (cd bundle && zip -qr ../bonsai-ws-state-sync-changes.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: bonsai-ws-state-sync-changes
          path: bonsai-ws-state-sync-changes.zip
          if-no-files-found: error
