name: Release
on:
  # Only executes merged base-branch code; supports releases for fork PRs.
  pull_request_target:
    branches: [main]
    types: [closed]
permissions:
  contents: write
concurrency:
  group: bonsai-release
  cancel-in-progress: false
  queue: max
jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Select and create version tag
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const {selectVersion} = require('./.github/scripts/release-version.cjs');
            const {prepareRelease} = require('./.github/scripts/release-publish.cjs');
            const {owner, repo} = context.repo;
            const sha = context.payload.pull_request.merge_commit_sha;
            const labels = context.payload.pull_request.labels.map(x => x.name);
            const tags = await github.paginate(github.rest.repos.listTags, {owner, repo, per_page: 100});
            const next = selectVersion(tags.map(x => x.name), labels);
            if (!next) { core.setOutput('skip', 'true'); return; }
            // Reuse this merge's tag on rerun, including after a failed build.
            const existing = tags.find(x => x.commit.sha === sha && /^v\d+\.\d+\.\d+$/.test(x.name));
            const tag = existing ? existing.name : next;
            if (!existing) await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha});
            core.setOutput('tag', tag);
            if (await prepareRelease(github, owner, repo, tag)) core.setOutput('skip', 'true');
      - name: Fetch release tag
        if: steps.version.outputs.skip != 'true'
        run: git fetch --tags --force
      - uses: goreleaser/goreleaser-action@v6
        if: steps.version.outputs.skip != 'true'
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}
  archive-smoke:
    name: Draft archive (${{ matrix.os }})
    needs: release
    if: needs.release.outputs.skip != 'true'
    # Draft release visibility requires push access.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Download actual draft release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: gh release download "$RELEASE_TAG" --dir dist --pattern "bonsai_*" --pattern checksums.txt
      - run: node .github/scripts/archive-smoke.cjs dist
  publish:
    needs: [release, archive-smoke]
    if: needs.release.outputs.skip != 'true' && needs.archive-smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Publish verified release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const {publishRelease} = require('./.github/scripts/release-publish.cjs');
            await publishRelease(github, owner, repo, process.env.RELEASE_TAG);
