name: Release
on:
  # Only executes merged base-branch code; supports releases for fork PRs.
  pull_request_target:
    branches: [main]
    types: [closed]
permissions:
  contents: write
concurrency:
  group: bonsai-release
  cancel-in-progress: false
  queue: max
jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Select and create version tag
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const {selectVersion} = require('./.github/scripts/release-version.cjs');
            const {owner, repo} = context.repo;
            const sha = context.payload.pull_request.merge_commit_sha;
            const labels = context.payload.pull_request.labels.map(x => x.name);
            const tags = await github.paginate(github.rest.repos.listTags, {owner, repo, per_page: 100});
            const next = selectVersion(tags.map(x => x.name), labels);
            if (!next) { core.setOutput('skip', 'true'); return; }
            // Reuse this merge's tag on rerun, including after a failed build.
            const existing = tags.find(x => x.commit.sha === sha && /^v\d+\.\d+\.\d+$/.test(x.name));
            const tag = existing ? existing.name : next;
            if (!existing) await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha});
            core.setOutput('tag', tag);
            try {
              const {data: release} = await github.rest.repos.getReleaseByTag({owner, repo, tag});
              if (!release.draft) core.setOutput('skip', 'true');
              else await github.rest.repos.deleteRelease({owner, repo, release_id: release.id});
            } catch (error) { if (error.status !== 404) throw error; }
      - name: Fetch release tag
        if: steps.version.outputs.skip != 'true'
        run: git fetch --tags --force
      - uses: goreleaser/goreleaser-action@v6
        if: steps.version.outputs.skip != 'true'
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}
      - name: Publish complete release
        if: steps.version.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: release} = await github.rest.repos.getReleaseByTag({owner, repo, tag: process.env.RELEASE_TAG});
            // Semantic ordering keeps a retry of an older release from becoming latest.
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false, make_latest: 'legacy'});
