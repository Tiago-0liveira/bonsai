name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: cmd
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            gofmt -d $(git ls-files '*.go')
            exit 1
          fi
      - name: Verify modules
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Check Unix installer syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Write-Error; exit 1 }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
  release-dry-run:
    name: GoReleaser dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate release labels
        run: node -e 'const event = require(process.env.GITHUB_EVENT_PATH); require("./.github/scripts/release-version.cjs").selectVersion([], event.pull_request.labels.map(x => x.name))'
      - run: node --test .github/scripts/*.test.cjs
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --snapshot --clean
  required:
    name: CI passes
    if: always()
    needs: [build, release-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check
        env:
          BUILD: ${{ needs.build.result }}
          RELEASE: ${{ needs.release-dry-run.result }}
        run: test "$BUILD" = success && test "$RELEASE" = success
